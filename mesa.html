<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa • ECO</title>
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="mesa.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="background"><div class="background-overlay"></div><div class="particles"></div></div>
<div class="table-app">
<aside id="tableSidebar" class="table-sidebar">
<div class="table-sidebar-brand"><div class="table-sidebar-symbol">◇</div><div><span>ECO</span><strong id="sidebarRoleTitle">MESA</strong></div></div>
<nav id="tableMenu" class="table-menu"></nav>
<div class="table-sidebar-footer"><button type="button" id="leaveTable" class="table-menu-button danger"><span class="table-menu-icon">↩</span><span class="table-menu-label">Sair</span></button></div>
</aside>
<main class="table-main">
<header class="table-header">
<div class="table-header-info"><span id="tableCampaignLabel" class="table-header-label">CAMPANHA</span><h1 id="tableCampaignName">Carregando...</h1></div>
<div class="table-header-actions"><div class="table-role-badge"><span id="tableRoleIcon">◇</span><strong id="tableRoleName">Jogador</strong></div><button type="button" id="toggleChat" class="table-header-button">💬</button></div>
</header>
<section class="scene-shell"><div class="table-play-area">
<div class="table-map-column"><div class="table-scene">
<div id="sceneBackground" class="scene-background"></div><div class="scene-dark-overlay"></div>
<span class="scene-side-label players-label">JOGADORES</span>
<div class="combat-side players-side">
<div class="combat-position player-position position-5" data-position="5"><span class="position-number">5</span><div class="position-token-slot"></div></div>
<div class="combat-position player-position position-6" data-position="6"><span class="position-number">6</span><div class="position-token-slot"></div></div>
<div class="combat-position player-position position-4" data-position="4"><span class="position-number">4</span><div class="position-token-slot"></div></div>
<div class="combat-position player-position position-3" data-position="3"><span class="position-number">3</span><div class="position-token-slot"></div></div>
<div class="combat-position player-position position-1" data-position="1"><span class="position-number">1</span><div class="position-token-slot"></div></div>
<div class="combat-position player-position position-2" data-position="2"><span class="position-number">2</span><div class="position-token-slot"></div></div>
</div>
<span class="scene-side-label enemies-label">AMEAÇAS</span>
<div class="combat-side enemies-side">
<div class="combat-position enemy-position position-1" data-position="1"><span class="position-number">1</span><div class="position-token-slot"></div></div>
<div class="combat-position enemy-position position-2" data-position="2"><span class="position-number">2</span><div class="position-token-slot"></div></div>
<div class="combat-position enemy-position position-3" data-position="3"><span class="position-number">3</span><div class="position-token-slot"></div></div>
<div class="combat-position enemy-position position-4" data-position="4"><span class="position-number">4</span><div class="position-token-slot"></div></div>
<div class="combat-position enemy-position position-5" data-position="5"><span class="position-number">5</span><div class="position-token-slot"></div></div>
<div class="combat-position enemy-position position-6" data-position="6"><span class="position-number">6</span><div class="position-token-slot"></div></div>
</div>
<div class="npc-line"><span class="npc-line-label">NPCs</span>
<div class="npc-position" data-npc-position="1"><span class="position-number">1</span><div class="position-token-slot"></div></div>
<div class="npc-position" data-npc-position="2"><span class="position-number">2</span><div class="position-token-slot"></div></div>
<div class="npc-position" data-npc-position="3"><span class="position-number">3</span><div class="position-token-slot"></div></div>
</div>
</div></div>
<section id="tableChat" class="table-chat table-chat-side">
<div class="table-chat-header"><div><span class="table-chat-label">COMUNICAÇÃO</span><h2>Chat</h2></div><button type="button" id="collapseChat" class="chat-collapse-button">›</button></div>
<div id="chatMessages" class="table-chat-messages"><div class="chat-system-message"><span class="chat-system-icon">◇</span><div><strong>Sistema</strong><p>Bem-vindo à mesa.</p></div></div></div>
<div class="table-chat-input"><input type="text" id="chatInput" placeholder="Digite uma mensagem..."><button type="button" id="sendChatMessage" class="chat-send-button">Enviar</button></div>
</section>
</div></section>
</main>
<div id="tablePanelOverlay" class="table-panel-overlay hidden"><div id="tableSidePanel" class="table-side-panel"><div class="table-side-panel-header"><div><span id="tablePanelLabel" class="table-panel-label">PAINEL</span><h2 id="tablePanelTitle">Painel</h2></div><button type="button" id="closeTablePanel" class="table-panel-close">✕</button></div><div id="tablePanelContent" class="table-panel-content"></div></div></div>
<div id="positionModal" class="table-modal hidden"><div class="table-modal-content"><div class="table-modal-header"><div><span class="table-panel-label">POSIÇÃO</span><h2 id="positionModalTitle">Posição</h2></div><button type="button" id="closePositionModal" class="table-panel-close">✕</button></div><div id="positionModalBody" class="table-modal-body"></div></div></div>
<div id="diceModal" class="table-modal hidden"><div class="table-modal-content dice-modal-content"><div class="table-modal-header"><div><span class="table-panel-label">ROLAGEM</span><h2>Dados</h2></div><button type="button" id="closeDiceModal" class="table-panel-close">✕</button></div><div class="dice-quick-grid"><button type="button" class="dice-quick-button" data-die="20">d20</button><button type="button" class="dice-quick-button" data-die="12">d12</button><button type="button" class="dice-quick-button" data-die="10">d10</button><button type="button" class="dice-quick-button" data-die="8">d8</button><button type="button" class="dice-quick-button" data-die="6">d6</button><button type="button" class="dice-quick-button" data-die="4">d4</button></div><div class="custom-roll"><div class="field"><label for="diceAmount">Quantidade</label><input type="number" id="diceAmount" min="1" max="100" value="1"></div><div class="field"><label for="diceSides">Dado</label><select id="diceSides"><option value="20">d20</option><option value="12">d12</option><option value="10">d10</option><option value="8">d8</option><option value="6">d6</option><option value="4">d4</option><option value="100">d100</option></select></div><div class="field"><label for="diceModifier">Modificador</label><input type="number" id="diceModifier" value="0"></div></div><button type="button" id="rollCustomDice" class="primary-button full-button">Rolar</button></div></div>
<div id="tableConfirmModal" class="table-modal hidden"><div class="table-modal-content compact-modal"><div class="table-confirm-icon">◇</div><h2 id="tableConfirmTitle">Confirmar</h2><p id="tableConfirmText">Deseja continuar?</p><div class="table-confirm-actions"><button type="button" id="tableConfirmCancel" class="secondary-button">Cancelar</button><button type="button" id="tableConfirmAccept" class="primary-button">Confirmar</button></div></div></div>
<audio id="campaignMusicPlayer" loop></audio>
<input type="file" id="sceneUploadInput" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="musicUploadInput" accept="audio/*" hidden>
<script src="rpg-systems.js"></script>
<script src="mesa.js"></script>
<script src="mesa-combate-habilidades.js"></script>
<script src="mesa-habilidades-avancadas.js"></script>
<script src="mesa-habilidades-finais.js"></script>
</body>
</html>
